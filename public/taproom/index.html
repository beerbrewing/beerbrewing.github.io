    <script type="module">
      import init, { process_url } from "./pkg/coupons_wasm.js";
      document.addEventListener("DOMContentLoaded", async function() {
        await init();
        const couponDiv = document.getElementById("coupon");
        function getCouponCodeFromQuery() {
          const params = new URLSearchParams(window.location.search);
          return params.get('code') || '';
        }
        const couponCode = getCouponCodeFromQuery();
        let decoded = null;
        if (couponCode) {
          try {
            decoded = process_url(window.location.href);
            console.log('decoded', couponCode, decoded);
          } catch (e) {
            console.warn('decode_error', couponCode, e);
          }
        }
        function deriveProduct(decoded, code) {
          if (!decoded || typeof decoded !== 'object') {
            return code && code.startsWith('BR') ? 'Brewlytics' : 'Kasm';
          }
          const brand = decoded.brand === 'Brewlytics' ? 'Brewlytics' : 'Kasm';
          if (brand === 'Brewlytics') return 'Brewlytics';
          const idx = (decoded.index ?? 0) >>> 0;
          if (idx >= 6 && idx <= 12) return 'Bangaz';
          if (idx >= 14 && idx <= 15) return 'Emanator';
          if (idx >= 16 && idx <= 20) return 'Kasm Arpeggiator';
          if (idx >= 21 && idx <= 26) return 'Kasm Rust SDK';
          if (idx >= 0 && idx <= 3) return 'Kasm LFO';
          return 'Kasm';
        }
        let derived = deriveProduct(decoded, couponCode);
        let result = '';
        if (couponCode) {
          result += `<p>You have a Coupon! <strong>${couponCode}</strong> - This coupon is a discount for <strong>${derived}</strong> copy and paste ${couponCode} at the checkout!</p>`;
          couponDiv.innerHTML = result;
        }
      });
    </script>
